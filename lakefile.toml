name = "complexitylib"
version = "0.1.0"
defaultTargets = ["Complexitylib"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "728a93eeff833da3173895bb0575752fdc24edb0"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "311d27ad8458b61e9b7461fc83a480e4be97aef2"

[[lean_lib]]
name = "Complexitylib"

# Keep each API regression in its own import environment and cache its build.
[[lean_lib]]
name = "ApiChecks"
srcDir = "scripts"
roots = [
  "VerifierApiCheck",
  "SATGuessVerifyApiCheck",
  "TapeTransportCheck",
  "NTMTraceTransportCheck",
  "StackEncodingCheck",
  "PairBuildApiCheck",
  "PairBuildCompatibilityCheck",
]
