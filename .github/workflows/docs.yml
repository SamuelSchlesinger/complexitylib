name: API Documentation and Blueprint

# Building doc-gen4 documentation also generates pages for Mathlib, which is
# slow. It runs on every push to the default branch (dev) so the published API
# docs track the code, plus weekly and on demand. The `pages` concurrency
# group below cancels a superseded in-progress run, so rapid merges don't pile
# up. The blueprint (blueprint/) is built alongside and published under
# /blueprint.
on:
  push:
    branches: [dev]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y \
            --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib build cache
        run: lake exe cache get
      - name: Build documentation
        working-directory: docbuild
        run: lake build Complexitylib:docs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install blueprint toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev
          pip install leanblueprint
      - name: Build blueprint and publish it under /blueprint
        run: |
          cd blueprint && leanblueprint web && cd ..
          cp -r blueprint/web docbuild/.lake/build/doc/blueprint
      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docbuild/.lake/build/doc

  deploy-docs:
    # Requires GitHub Pages to be enabled for the repository with
    # "GitHub Actions" as the source.
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
