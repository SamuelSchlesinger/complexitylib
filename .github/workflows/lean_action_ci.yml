name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Style lint (headers, module docs, line length)
        run: python3 scripts/lint_style.py
      - name: Test maintenance scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      # Keep the large, pinned dependencies separate from per-commit outputs.
      # Never restore a different toolchain/configuration/manifest snapshot.
      - name: Restore Lean dependencies
        id: lean-deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/packages
          key: lean-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
      - name: Restore project build
        id: lean-build
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: lean-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lean-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Build library and all executable regression guards
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: >-
            --wfail Complexitylib
            Complexitylib.Classes.P.Cobham.Validation
            Complexitylib.Models.TuringMachine.SingleTape.Validation
            Complexitylib.Models.TuringMachine.Repetition.Validation
            Complexitylib.Circuits.Encoding.Validation
            Complexitylib.SAT.Tseitin.Machine.Validation
            ApiChecks runLinter
          use-github-cache: false
          use-mathlib-cache: true
      - name: Run isolated environment linters, including validation-only graphs
        run: lake env python3 scripts/lint_environment.py
      - name: Axiom guard for headline theorems
        run: lake env lean scripts/AxiomGuard.lean
      - name: Blueprint declarations exist
        run: lake env lean scripts/BlueprintCheck.lean
      # Save only after every gate succeeds. Only dev writes the large pinned
      # dependency snapshot; PRs keep smaller project outputs in their isolated
      # merge-ref cache scope for the next iteration. Feature-branch push runs
      # avoid duplicating the PR upload. Docs can only read the dev snapshots.
      - name: Save Lean dependencies
        if: github.ref == 'refs/heads/dev' && steps.lean-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/packages
          key: ${{ steps.lean-deps.outputs.cache-primary-key }}
      - name: Save project build
        if: (github.ref == 'refs/heads/dev' || github.event_name == 'pull_request') && steps.lean-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: ${{ steps.lean-build.outputs.cache-primary-key }}
