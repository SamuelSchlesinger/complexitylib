name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Style lint (headers, module docs, line length)
        run: python3 scripts/lint_style.py
      - name: Test maintenance scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build library with warnings as errors
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "--wfail"
      - name: Run Cobham-characterization regression guards
        run: lake build --wfail Complexitylib.Classes.P.Cobham.Validation
      - name: Run single-tape simulation regression guards
        run: lake build --wfail Complexitylib.Models.TuringMachine.SingleTape.Validation
      - name: Run fixed-time repetition regression guards
        run: lake build --wfail Complexitylib.Models.TuringMachine.Repetition.Validation
      - name: Run encoded-circuit regression guards
        run: lake build --wfail Complexitylib.Circuits.Encoding.Validation
      - name: Run Tseitin-machine regression guards
        run: lake build --wfail Complexitylib.SAT.Tseitin.Machine.Validation
      - name: Check public verifier and exact-machine compatibility APIs
        run: |
          lake env lean scripts/VerifierApiCheck.lean
          lake env lean scripts/SATGuessVerifyApiCheck.lean
      - name: Check exact tape-layout transport boundaries
        run: lake env lean scripts/TapeTransportCheck.lean
      - name: Check choice-preserving NTM prefix transport
        run: lake env lean scripts/NTMTraceTransportCheck.lean
      - name: Check exact shared stack encoding and compatibility
        run: lake env lean scripts/StackEncodingCheck.lean
      - name: Check public pair-builder and legacy import APIs
        run: |
          lake env lean scripts/PairBuildApiCheck.lean
          lake env lean scripts/PairBuildCompatibilityCheck.lean
      - name: Run environment linters, including validation-only graphs
        run: |
          lake exe runLinter Complexitylib \
            Complexitylib.Classes.P.Cobham.Validation \
            Complexitylib.Models.TuringMachine.SingleTape.Validation \
            Complexitylib.Models.TuringMachine.Repetition.Validation \
            Complexitylib.Circuits.Encoding.Validation \
            Complexitylib.SAT.Tseitin.Machine.Validation
      - name: Axiom guard for headline theorems
        run: lake env lean scripts/AxiomGuard.lean
      - name: Blueprint declarations exist
        run: lake env lean scripts/BlueprintCheck.lean
